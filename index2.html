<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MemHash Miner - Ultimate</title>
  <!-- Підключення Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --primary-color: #1e1e1e;
      --accent-color: #ffc107;
      --text-color: #e0e0e0;
      --secondary-text: #aaa;
      --btn-success: #4caf50;
      --btn-success-hover: #43a047;
      --btn-danger: #e53935;
      --btn-danger-hover: #d32f2f;
      --nav-bg: #1e1e1e;
      --nav-border: #333;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      font-family: 'Roboto', sans-serif;
      color: var(--text-color);
      padding-bottom: 100px; /* Для нижньої навігації */
      transition: background 0.3s ease, color 0.3s ease;
    }
    header {
      text-align: center;
      padding: 20px 0;
      background: var(--primary-color);
      border-bottom: 1px solid var(--nav-border);
    }
    header h1 {
      margin: 0;
      font-size: 2.8em;
      color: var(--text-color);
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
    }
    /* Секції */
    .section {
      display: none;
      animation: fadeIn 0.5s ease;
    }
    .section.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Інформаційні панелі */
    .info {
      display: flex;
      justify-content: space-between;
      background: var(--primary-color);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .info-item {
      flex: 1;
      text-align: center;
      border-right: 1px solid var(--nav-border);
    }
    .info-item:last-child {
      border-right: none;
    }
    .info-item h3 {
      margin: 0;
      font-size: 0.9em;
      color: var(--secondary-text);
    }
    .info-item p {
      margin: 5px 0 0;
      font-size: 1.8em;
      color: var(--text-color);
    }
    /* Панель статистики */
    .stats-panel {
      background: var(--primary-color);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }
    .stats-panel p {
      margin: 5px 0;
      font-size: 1em;
      color: var(--text-color);
    }
    /* Кнопки */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .buttons button {
      padding: 15px 30px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      width: 200px;
    }
    #startBtn {
      background: var(--btn-success);
      color: #fff;
    }
    #startBtn:hover {
      background: var(--btn-success-hover);
    }
    #stopBtn {
      background: var(--btn-danger);
      color: #fff;
    }
    #stopBtn:hover {
      background: var(--btn-danger-hover);
    }
    /* Блоки майнінгу */
    #blocksContainer {
      margin-top: 20px;
    }
    .block {
      background: var(--primary-color);
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      animation: slideIn 0.4s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(-10px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .block p {
      margin: 5px 0;
      font-size: 0.9em;
      line-height: 1.4;
    }
    .block span {
      font-weight: 500;
      color: var(--accent-color);
    }
    /* Таблиця лідерів */
    .leaderboard-container {
      background: var(--primary-color);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      margin-top: 20px;
    }
    .leaderboard-container h2 {
      text-align: center;
      margin-bottom: 15px;
      color: var(--text-color);
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      color: var(--text-color);
    }
    .leaderboard-table th,
    .leaderboard-table td {
      padding: 10px;
      border: 1px solid var(--nav-border);
      text-align: center;
    }
    .leaderboard-table th {
      background: #2e2e2e;
    }
    .leaderboard-table td {
      background: var(--bg-color);
    }
    /* Профіль */
    .profile-card {
      background: var(--primary-color);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      text-align: center;
      max-width: 400px;
      margin: 0 auto;
    }
    .profile-card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 2px solid var(--accent-color);
    }
    .profile-card h2 {
      margin: 0;
      font-size: 1.5em;
      color: var(--text-color);
    }
    .profile-card p {
      margin: 5px 0;
      color: var(--secondary-text);
    }
    .profile-card button {
      margin-top: 15px;
      padding: 10px 20px;
      background: var(--btn-success);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s;
    }
    .profile-card button:hover {
      background: var(--btn-success-hover);
    }
    #profileForm {
      display: none;
      margin-top: 15px;
    }
    #profileForm input {
      padding: 10px;
      width: 80%;
      margin-bottom: 10px;
      border: none;
      border-radius: 4px;
    }
    #saveProfileBtn {
      padding: 10px 20px;
      background: var(--btn-success);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
    }
    /* Налаштування */
    .settings {
      background: var(--primary-color);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      text-align: center;
      color: var(--secondary-text);
    }
    .settings button {
      padding: 10px 20px;
      background: var(--btn-success);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 15px;
    }
    .settings button:hover {
      background: var(--btn-success-hover);
    }
    .toggle-container {
      margin-top: 20px;
      text-align: center;
    }
    .toggle-container label {
      font-size: 1em;
      cursor: pointer;
    }
    .toggle-container input[type="checkbox"] {
      margin-left: 10px;
      cursor: pointer;
    }
    /* Нижня навігація */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--nav-bg);
      border-top: 1px solid var(--nav-border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }
    .bottom-nav button {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 0.9em;
      cursor: pointer;
      transition: color 0.3s;
    }
    .bottom-nav button img {
      vertical-align: middle;
      margin-bottom: 4px;
    }
    .bottom-nav button:hover {
      color: var(--accent-color);
    }
    .bottom-nav button:focus {
      outline: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>MemHash Miner</h1>
  </header>
  <div class="container">
    <!-- Секція майнінгу -->
    <div id="miningSection" class="section active">
      <div class="info">
        <div class="info-item">
          <h3>Баланс YTon</h3>
          <p id="balance">0</p>
        </div>
        <div class="info-item">
          <h3>Енергія</h3>
          <p id="energy">7000</p>
        </div>
        <div class="info-item">
          <h3>Статус</h3>
          <p id="status">Готовий до майнінгу</p>
        </div>
      </div>
      <!-- Панель статистики -->
      <div class="stats-panel">
        <p>Блоків видобуто: <span id="totalBlocks">0</span></p>
        <p>Загальна витрата енергії: <span id="totalEnergySpent">0</span></p>
        <p>Ефективність: <span id="efficiency">0</span> YTon/ед.</p>
      </div>
      <div class="buttons">
        <button id="startBtn">Запустити майнінг</button>
        <button id="stopBtn" disabled>Зупинити майнінг</button>
      </div>
      <div id="blocksContainer"></div>
    </div>
    <!-- Секція лідерів -->
    <div id="leadersSection" class="section">
      <div class="leaderboard-container">
        <h2>Таблиця лідерів</h2>
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>Місце</th>
              <th>Ім'я</th>
              <th>Баланс YTon</th>
            </tr>
          </thead>
          <tbody id="leaderboard">
            <!-- Дані оновлюються динамічно -->
          </tbody>
        </table>
      </div>
    </div>
    <!-- Секція профілю -->
    <div id="profileSection" class="section">
      <div class="profile-card">
        <img src="https://via.placeholder.com/100" alt="Avatar">
        <h2 id="profileName">Ім'я користувача</h2>
        <p id="profileEmail">email@example.com</p>
        <button id="editProfileBtn">Редагувати профіль</button>
        <div id="profileForm">
          <input type="text" id="newName" placeholder="Нове ім'я">
          <br>
          <input type="email" id="newEmail" placeholder="Новий email">
          <br>
          <button id="saveProfileBtn">Зберегти</button>
        </div>
      </div>
    </div>
    <!-- Секція налаштувань -->
    <div id="settingsSection" class="section">
      <div class="settings">
        <h2>Налаштування</h2>
        <p>Функціонал налаштувань незапроваджено.</p>
        <div class="toggle-container">
          <label for="darkModeToggle">Темний режим
            <input type="checkbox" id="darkModeToggle">
          </label>
        </div>
        <button id="resetStatsBtn">Скинути статистику</button>
      </div>
    </div>
  </div>
  <!-- Фіксована нижня навігація з зображеннями (із Flaticon) -->
  <footer class="bottom-nav">
    <button id="navMining">
      <img src="https://cdn-icons-png.flaticon.com/512/3145/3145784.png" alt="Майнінг" width="24" height="24"><br>Майнінг
    </button>
    <button id="navLeaders">
      <img src="https://cdn-icons-png.flaticon.com/512/2277/2277327.png" alt="Лідери" width="24" height="24"><br>Лідери
    </button>
    <button id="navProfile">
      <img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" alt="Профіль" width="24" height="24"><br>Профіль
    </button>
    <button id="navSettings">
      <img src="https://cdn-icons-png.flaticon.com/512/126/126472.png" alt="Налаштування" width="24" height="24"><br>Налаштування
    </button>
  </footer>
  
  <script>
    // Функція перемикання секцій
    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(sec => {
        sec.classList.toggle('active', sec.id === sectionId);
      });
    }
    document.getElementById('navMining').addEventListener('click', () => { showSection('miningSection'); });
    document.getElementById('navLeaders').addEventListener('click', () => { showSection('leadersSection'); updateLeaderboard(); });
    document.getElementById('navProfile').addEventListener('click', () => { showSection('profileSection'); });
    document.getElementById('navSettings').addEventListener('click', () => { showSection('settingsSection'); });
    
    // Завантаження збережених даних
    let balance = parseFloat(localStorage.getItem('balance')) || 0;
    let energy = parseFloat(localStorage.getItem('energy')) || 7000;
    let mineInterval, energyRegenInterval;
    let totalBlocksMined = parseInt(localStorage.getItem('totalBlocksMined')) || 0;
    let totalEnergySpent = parseFloat(localStorage.getItem('totalEnergySpent')) || 0;
    
    const balanceEl = document.getElementById('balance');
    const energyEl = document.getElementById('energy');
    const statusEl = document.getElementById('status');
    const blocksContainer = document.getElementById('blocksContainer');
    const totalBlocksEl = document.getElementById('totalBlocks');
    const totalEnergySpentEl = document.getElementById('totalEnergySpent');
    const efficiencyEl = document.getElementById('efficiency');
    
    balanceEl.textContent = balance.toFixed(2);
    energyEl.textContent = energy.toFixed(1);
    
    function updateStatus(message) {
      statusEl.textContent = message;
    }
    
    function updateEnergy(amount) {
      energy += amount;
      energyEl.textContent = energy.toFixed(1);
      localStorage.setItem('energy', energy.toFixed(1));
      if(amount < 0) {
        totalEnergySpent += Math.abs(amount);
        localStorage.setItem('totalEnergySpent', totalEnergySpent.toFixed(1));
      }
      if (energy <= 0) {
        updateStatus("Енергія вичерпана. Майнинг зупинено.");
        clearInterval(mineInterval);
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
      }
    }
    
    function updateBalance(amount) {
      balance += amount;
      balanceEl.textContent = balance.toFixed(2);
      localStorage.setItem('balance', balance.toFixed(2));
      updateLeaderboard();
    }
    
    // Функція оновлення лідерстатсу (динамічна таблиця)
    function updateLeaderboard() {
      let leaderboard = JSON.parse(localStorage.getItem('leaderboard')) || [
        { name: "Гравець 1", balance: 1000 },
        { name: "Гравець 2", balance: 950 },
        { name: "Гравець 3", balance: 900 }
      ];
      // Оновлення даних поточного користувача (за профілем)
      let currentName = profile.name;
      let currentBalance = balance;
      let idx = leaderboard.findIndex(player => player.name === currentName);
      if (idx !== -1) {
        leaderboard[idx].balance = currentBalance;
      } else {
        leaderboard.push({ name: currentName, balance: currentBalance });
      }
      leaderboard.sort((a, b) => b.balance - a.balance);
      localStorage.setItem('leaderboard', JSON.stringify(leaderboard));
      const leaderboardTbody = document.getElementById('leaderboard');
      leaderboardTbody.innerHTML = '';
      leaderboard.forEach((player, index) => {
        leaderboardTbody.innerHTML += `<tr>
          <td>${index+1}</td>
          <td>${player.name}</td>
          <td>${player.balance.toFixed(2)} YTon</td>
        </tr>`;
      });
    }
    
    // Фонове поповнення енергії кожні 45 секунд (від 1 до 5)
    energyRegenInterval = setInterval(() => {
      let regenAmount = Math.random() * (5 - 1) + 1;
      updateEnergy(regenAmount);
    }, 45000);
    
    // Симуляція майнінгу
    function startMining() {
      if (energy > 0) {
        updateStatus("Майнінг запущено...");
        // Збільшуємо затримку створення блоків до 3000 мс (3 секунди)
        mineInterval = setInterval(() => {
          let reward = parseFloat((Math.random() * (1 - 0.1) + 0.1).toFixed(2));
          updateBalance(reward);
          let block = document.createElement('div');
          block.className = 'block';
          block.innerHTML = `
            <p>Хеш: <span>${Math.random().toString(36).substring(2, 15)}</span></p>
            <p>Час: <span>${new Date().toLocaleTimeString()}</span></p>
            <p>Нагорода: <span>${reward} YTon</span></p>
          `;
          blocksContainer.appendChild(block);
          if (blocksContainer.children.length > 5) {
            blocksContainer.removeChild(blocksContainer.firstChild);
          }
          totalBlocksMined++;
          localStorage.setItem('totalBlocksMined', totalBlocksMined);
          // Віднімання енергії (від -34 до -102)
          let energyCost = parseFloat((Math.random() * (-102 + 34) - 34).toFixed(1));
          updateEnergy(energyCost);
          efficiencyEl.textContent = totalBlocksMined > 0 ? (balance / totalEnergySpent).toFixed(2) : 0;
        }, 3000);
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
      } else {
        updateStatus("Недостатньо енергії для майнінгу.");
      }
    }
    
    function stopMining() {
      clearInterval(mineInterval);
      updateStatus("Майнінг зупинено.");
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }
    
    document.getElementById('startBtn').addEventListener('click', startMining);
    document.getElementById('stopBtn').addEventListener('click', stopMining);
    
    // Обробка профілю
    const profileNameEl = document.getElementById('profileName');
    const profileEmailEl = document.getElementById('profileEmail');
    const editProfileBtn = document.getElementById('editProfileBtn');
    const profileForm = document.getElementById('profileForm');
    const saveProfileBtn = document.getElementById('saveProfileBtn');
    const newNameInput = document.getElementById('newName');
    const newEmailInput = document.getElementById('newEmail');
    
    let profile = JSON.parse(localStorage.getItem('profile')) || {
      name: "Ім'я користувача",
      email: "email@example.com"
    };
    
    function updateProfileDisplay() {
      profileNameEl.textContent = profile.name;
      profileEmailEl.textContent = profile.email;
      updateLeaderboard();
    }
    
    updateProfileDisplay();
    
    editProfileBtn.addEventListener('click', () => {
      profileForm.style.display = profileForm.style.display === 'none' ? 'block' : 'none';
      newNameInput.value = profile.name;
      newEmailInput.value = profile.email;
    });
    
    saveProfileBtn.addEventListener('click', () => {
      profile.name = newNameInput.value;
      profile.email = newEmailInput.value;
      localStorage.setItem('profile', JSON.stringify(profile));
      updateProfileDisplay();
      profileForm.style.display = 'none';
    });
    
    // Обробка кнопки скидання статистики
    document.getElementById('resetStatsBtn')?.addEventListener('click', () => {
      totalBlocksMined = 0;
      totalEnergySpent = 0;
      localStorage.setItem('totalBlocksMined', 0);
      localStorage.setItem('totalEnergySpent', 0);
      document.getElementById('totalBlocks').textContent = totalBlocksMined;
      document.getElementById('totalEnergySpent').textContent = totalEnergySpent.toFixed(1);
      efficiencyEl.textContent = 0;
    });
    
    // Обробка темного режиму
    document.getElementById('darkModeToggle')?.addEventListener('change', function() {
      if(this.checked) {
        document.body.style.background = "#121212";
        document.body.style.color = "#e0e0e0";
      } else {
        document.body.style.background = "#ffffff";
        document.body.style.color = "#333";
      }
    });
  </script>
</body>
</html>
